<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc Mừng 20/10 ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at center, #1f0510 0%, #070104 100%);
      font-family: 'Quicksand', sans-serif; color: #fff;
    }
    canvas#bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* Màn hình chạm mở quà */
    #startScreen {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(35,5,18,0.92) 0%, rgba(5,1,3,0.98) 100%);
      transition: opacity 0.8s ease, visibility 0.8s;
      cursor: pointer; text-align: center; padding: 20px;
    }
    .pulse-heart {
      font-size: 75px; filter: drop-shadow(0 0 25px #ff2a6d);
      animation: beat 1.2s infinite ease-in-out; margin-bottom: 20px;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1.05); }
      45% { transform: scale(1.18); }
    }
    .start-title {
      font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: #ff8da1;
      text-shadow: 0 0 15px rgba(255,42,109,0.8); margin-bottom: 10px;
    }
    .start-sub { font-size: 0.95rem; color: #ffd1dc; opacity: 0.85; animation: fadePulse 2s infinite; }
    @keyframes fadePulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* Khung hiển thị lời chúc */
    #messageContainer {
      position: fixed; bottom: 8%; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 520px; z-index: 10;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 105, 135, 0.25);
      border-radius: 20px; padding: 22px 24px;
      box-shadow: 0 10px 35px rgba(255, 20, 80, 0.18);
      text-align: center; opacity: 0; transition: opacity 1s ease;
      pointer-events: none;
    }
    #messageContainer.show { opacity: 1; }
    .msg-header {
      font-family: 'Dancing Script', cursive; font-size: 2rem; color: #ff5e8e;
      text-shadow: 0 0 12px rgba(255,94,142,0.7); margin-bottom: 12px;
    }
    .msg-line {
      font-size: 1.08rem; line-height: 1.65; color: #fff0f3;
      min-height: 1.65em; margin-bottom: 6px; font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* Nút công cụ tạo QR */
    #qrBtn {
      position: fixed; top: 15px; right: 15px; z-index: 30;
      background: rgba(255, 42, 109, 0.25); border: 1px solid rgba(255, 141, 161, 0.5);
      color: #ffd1dc; padding: 8px 14px; border-radius: 30px; font-size: 0.8rem;
      cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s;
    }
    #qrBtn:hover { background: rgba(255, 42, 109, 0.5); }

    /* Modal tạo Thiệp QR */
    #qrModal {
      position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; padding: 15px;
    }
    .modal-box {
      background: #fff0f5; color: #4a1525; border-radius: 20px; padding: 22px;
      width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 10px 40px rgba(255,42,109,0.4);
    }
    .modal-box h3 { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: #d81b60; margin-bottom: 10px; }
    .modal-box input {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid #f48fb1;
      margin-bottom: 12px; font-size: 0.85rem; outline: none;
    }
    #qrCardCanvas {
      width: 100%; max-width: 260px; border-radius: 14px;
      box-shadow: 0 4px 15px rgba(216,27,96,0.2); margin: 0 auto 12px; display: block;
    }
    .btn-group { display: flex; gap: 8px; justify-content: center; }
    .btn-pink {
      background: linear-gradient(135deg, #ff4081, #c2185b); color: #fff;
      border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
    }
    .btn-close {
      background: #f8bbd0; color: #880e4f; border: none; padding: 10px 14px;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ chạm -->
  <div id="startScreen">
    <div class="pulse-heart">❤️</div>
    <div class="start-title">Món Quà Nhỏ Ngày 20/10</div>
    <div class="start-sub">Chạm vào trái tim để mở lời nhắn...</div>
  </div>

  <!-- Nút bật khung lấy mã QR (Tự ẩn nếu thêm ?gift=1 vào link) -->
  <button id="qrBtn">💝 Tạo Thiệp QR</button>

  <!-- Canvas hạt trái tim 3D -->
  <canvas id="bgCanvas"></canvas>

  <!-- Khung chạy chữ -->
  <div id="messageContainer">
    <div class="msg-header">Happy Vietnamese Women's Day 20/10</div>
    <div id="line1" class="msg-line"></div>
    <div id="line2" class="msg-line"></div>
    <div id="line3" class="msg-line"></div>
    <div id="line4" class="msg-line"></div>
  </div>

  <!-- Modal xuất Thiệp QR Trái Tim -->
  <div id="qrModal">
    <div class="modal-box">
      <h3>Thiệp QR Tình Yêu ❤️</h3>
      <input type="text" id="qrUrlInput" value="https://xuanbang2207.github.io/qua-20-10/?gift=1" />
      <canvas id="qrCardCanvas" width="600" height="750"></canvas>
      <div id="hiddenQr" style="display:none;"></div>
      <div class="btn-group">
        <button class="btn-pink" id="downloadQrBtn">⬇️ Tải Ảnh Thiệp QR</button>
        <button class="btn-close" id="closeModalBtn">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    // Ẩn nút Tạo QR khi bạn gái quét mã (có đuôi ?gift=1)
    if (window.location.search.includes('gift=1')) {
      document.getElementById('qrBtn').style.display = 'none';
    }

    // --- 1. HIỆU ỨNG HẠT TRÁI TIM 3D (ECHO OF HEART) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    const particles = [];
    const PARTICLE_COUNT = 750;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random());
      // Công thức toán học hình trái tim
      const hx = 16 * Math.pow(Math.sin(t), 3) * r;
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
      particles.push({
        hx, hy,
        x: Math.random() * W, y: Math.random() * H,
        size: Math.random() * 2.2 + 0.8,
        color: `hsl(${335 + Math.random() * 30}, 100%, ${60 + Math.random() * 25}%)`,
        offset: Math.random() * Math.PI * 2
      });
    }

    // Pháo hoa trái tim nhỏ khi chạm
    const sparks = [];
    window.addEventListener('pointerdown', (e) => {
      for (let i = 0; i < 18; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1.5;
        sparks.push({
          x: e.clientX, y: e.clientY,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          alpha: 1, size: Math.random() * 3 + 2
        });
      }
    });

    let time = 0;
    function animate() {
      ctx.fillStyle = 'rgba(12, 2, 7, 0.22)';
      ctx.fillRect(0, 0, W, H);
      time += 0.04;

      const scale = Math.min(W, H) / 42;
      const beat = 1 + 0.08 * Math.sin(time * 2.2) + 0.04 * Math.cos(time * 4.4);
      const centerY = H * 0.36;

      particles.forEach(p => {
        const targetX = W / 2 + p.hx * scale * beat + Math.sin(time + p.offset) * 3;
        const targetY = centerY + p.hy * scale * beat + Math.cos(time + p.offset) * 3;
        p.x += (targetX - p.x) * 0.08;
        p.y += (targetY - p.y) * 0.08;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.alpha -= 0.025;
        if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255, 105, 150, ${s.alpha})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    animate();

    // --- 2. HỘP NHẠC PIANO TỰ ĐỘNG (WEB AUDIO API) ---
    let audioCtx, musicInterval;
    const notes = [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 783.99, 659.25, 587.33, 698.46, 880.00, 1174.66, 783.99, 987.77, 1174.66, 1318.51];
    function playMusicBox() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let idx = 0;
      musicInterval = setInterval(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(notes[idx % notes.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.4);
        idx++;
      }, 420);
    }

    // --- 3. HIỆU ỨNG CHẠY CHỮ TỪNG DÒNG ---
    const lines = [
      "Chúc em 20/10 vui vẻ,",
      "luôn xinh đẹp, mạnh khỏe và bình an.",
      "Anh không giỏi nói lời ngọt ngào,",
      "nhưng luôn yêu thương và trân trọng em ❤️"
    ];

    function typeLine(elId, text, delay) {
      return new Promise(resolve => {
        setTimeout(() => {
          const el = document.getElementById(elId);
          let i = 0;
          const timer = setInterval(() => {
            el.textContent += text.charAt(i);
            i++;
            if (i >= text.length) { clearInterval(timer); resolve(); }
          }, 55);
        }, delay);
      });
    }

    document.getElementById('startScreen').addEventListener('click', async () => {
      const s = document.getElementById('startScreen');
      s.style.opacity = '0';
      setTimeout(() => s.style.visibility = 'hidden', 800);
      playMusicBox();
      document.getElementById('messageContainer').classList.add('show');
      await typeLine('line1', lines[0], 600);
      await typeLine('line2', lines[1], 400);
      await typeLine('line3', lines[2], 600);
      await typeLine('line4', lines[3], 400);
    });

    // --- 4. VẼ THIỆP QR MÀU HỒNG ---
    const qrModal = document.getElementById('qrModal');
    const qrInput = document.getElementById('qrUrlInput');
    const cardCanvas = document.getElementById('qrCardCanvas');
    const cCtx = cardCanvas.getContext('2d');

    function renderQrCard(url) {
      const hidden = document.getElementById('hiddenQr');
      hidden.innerHTML = '';
      new QRCode(hidden, { text: url, width: 360, height: 360, colorDark: "#c2185b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
      setTimeout(() => {
        const qrImg = hidden.querySelector('img') || hidden.querySelector('canvas');
        const grad = cCtx.createLinearGradient(0, 0, 600, 750);
        grad.addColorStop(0, '#ffe4ec'); grad.addColorStop(1, '#ffc1d6');
        cCtx.fillStyle = grad; cCtx.fillRect(0, 0, 600, 750);

        cCtx.fillStyle = '#ffffff';
        cCtx.beginPath(); cCtx.roundRect(90, 140, 420, 420, 28); cCtx.fill();

        if (qrImg) cCtx.drawImage(qrImg, 120, 170, 360, 360);

        // Vẽ trái tim giữa mã QR
        cCtx.fillStyle = '#fff';
        cCtx.beginPath(); cCtx.arc(300, 350, 38, 0, Math.PI * 2); cCtx.fill();
        cCtx.font = '46px sans-serif'; cCtx.textAlign = 'center'; cCtx.textBaseline = 'middle';
        cCtx.fillText('❤️', 300, 353);

        cCtx.fillStyle = '#ad1457'; cCtx.font = 'bold 38px "Quicksand", sans-serif';
        cCtx.fillText('Happy Women\'s Day 20/10', 300, 80);
        cCtx.font = '600 24px "Quicksand", sans-serif'; cCtx.fillStyle = '#880e4f';
        cCtx.fillText('Quét mã để mở món quà bí mật nhé ❤️', 300, 630);
      }, 150);
    }

    document.getElementById('qrBtn').addEventListener('click', () => {
      qrModal.style.display = 'flex';
      renderQrCard(qrInput.value);
    });
    qrInput.addEventListener('input', () => renderQrCard(qrInput.value));
    document.getElementById('closeModalBtn').addEventListener('click', () => qrModal.style.display = 'none');
    document.getElementById('downloadQrBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'Thiep-QR-20-10.png';
      a.href = cardCanvas.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
